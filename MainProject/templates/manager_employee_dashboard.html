<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard - Employees</title>
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4cc9f0;
            --success-color: #4caf50;
            --warning-color: #ff9800;
            --danger-color: #f44336;
            --dark-color: #212121;
            --light-color: #f8f9fa;
            --gray-color: #6c757d;
            --border-radius: 8px;
            --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: var(--dark-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background-color: white;
            box-shadow: var(--box-shadow);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-color);
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: var(--dark-color);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            position: relative;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: var(--primary-color);
            transition: var(--transition);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .page-title {
            margin: 30px 0;
            color: var(--dark-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            padding: 10px 15px;
            border-radius: var(--border-radius);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-block;
            text-align: center;
            border: none;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
        }

        .employee-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .employee-card {
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 20px;
            transition: var(--transition);
            position: relative;
        }

        .employee-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        .employee-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .employee-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 500;
            margin-right: 15px;
        }

        .employee-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--dark-color);
        }

        .employee-email {
            color: var(--gray-color);
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .tech-stack {
            background-color: #f0f7ff;
            padding: 10px;
            border-radius: var(--border-radius);
            margin-bottom: 15px;
        }

        .tech-stack-title {
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .tech-stack-content {
            font-size: 0.9rem;
            color: var(--dark-color);
        }

        .task-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .task-stat {
            text-align: center;
            flex: 1;
        }

        .task-stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .task-stat-label {
            font-size: 0.8rem;
            color: var(--gray-color);
        }

        .employee-actions {
            display: flex;
            justify-content: space-between;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
        }

        .btn-outline:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            overflow: auto;
        }

        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 20px;
            border-radius: var(--border-radius);
            max-width: 500px;
            box-shadow: var(--box-shadow);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--dark-color);
        }

        .close {
            color: var(--gray-color);
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: var(--dark-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: var(--dark-color);
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            font-size: 0.9rem;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .loading {
            text-align: center;
            padding: 40px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(67, 97, 238, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background-color: rgba(244, 67, 54, 0.1);
            color: var(--danger-color);
            padding: 15px;
            border-radius: var(--border-radius);
            margin: 20px 0;
            text-align: center;
        }

        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: var(--gray-color);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #ddd;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .employee-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }

        @media (max-width: 480px) {
            .employee-grid {
                grid-template-columns: 1fr;
            }

            .page-title {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="/" class="logo">Task<span>Flow</span></a>
            <nav class="nav-links">
                <a href="/dashboard/tasks/">Tasks</a>
                <a href="/dashboard/tasks/create/">Create Task</a>
                <a href="/dashboard/tasks/assign/">Assign Task</a>
                <a href="/api/tasks/activities/view/">Activity Log</a>
                <a href="/auth/logout/">Logout</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading employee data...</p>
        </div>

        <div id="error-message" class="error-message" style="display: none;"></div>

        <div id="dashboard-content" style="display: none;">
            <div class="page-title">
                <h1>Employee Management</h1>
                <button id="create-task-btn" class="btn btn-primary">Create New Task</button>
            </div>

            <div id="employee-grid" class="employee-grid">
                <!-- Employee cards will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Task Assignment Modal -->
    <div id="task-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Assign Task to <span id="employee-name-display"></span></h2>
                <span class="close">&times;</span>
            </div>
            <form id="assign-task-form">
                <div class="form-group">
                    <label for="task-select" class="form-label">Select Task</label>
                    <select id="task-select" class="form-control" required>
                        <option value="">-- Select a task --</option>
                        <!-- Task options will be inserted here -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="due-date" class="form-label">Due Date</label>
                    <input type="date" id="due-date" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="note" class="form-label">Note (Optional)</label>
                    <textarea id="note" class="form-control" rows="3"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" id="cancel-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Assign Task</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Get DOM elements
            const loadingElement = document.getElementById('loading');
            const errorMessageElement = document.getElementById('error-message');
            const dashboardContentElement = document.getElementById('dashboard-content');
            const employeeGridElement = document.getElementById('employee-grid');
            const createTaskBtn = document.getElementById('create-task-btn');
            const taskModal = document.getElementById('task-modal');
            const closeModalBtn = document.querySelector('.close');
            const cancelBtn = document.getElementById('cancel-btn');
            const assignTaskForm = document.getElementById('assign-task-form');
            const taskSelect = document.getElementById('task-select');
            const employeeNameDisplay = document.getElementById('employee-name-display');

            // Current employee ID for task assignment
            let currentEmployeeId = null;

            // Fetch data
            fetchEmployeeData();

            // Event listeners
            createTaskBtn.addEventListener('click', function() {
                window.location.href = '/dashboard/tasks/create/';
            });

            closeModalBtn.addEventListener('click', closeModal);
            cancelBtn.addEventListener('click', closeModal);

            assignTaskForm.addEventListener('submit', function(e) {
                e.preventDefault();
                assignTask();
            });

            // Functions
            async function fetchEmployeeData() {
                const token = localStorage.getItem('access_token');
                if (!token) {
                    showError('You must be logged in to view this page.');
                    return;
                }

                try {
                    // Fetch dashboard data (includes manager profile, team stats, and employees)
                    const response = await fetch('/api/users/manager/dashboard/', {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.status === 401) {
                        showError('Your session has expired. Please login again.');
                        setTimeout(() => {
                            window.location.href = '/auth/login/manager/';
                        }, 2000);
                        return;
                    }

                    if (!response.ok) {
                        throw new Error('Failed to fetch dashboard data');
                    }

                    const dashboardData = await response.json();

                    // Render employees
                    renderEmployees(dashboardData.employees);

                    // Store unassigned tasks for later use
                    window.unassignedTasks = dashboardData.unassigned_tasks || [];

                    // Show dashboard content
                    loadingElement.style.display = 'none';
                    dashboardContentElement.style.display = 'block';
                } catch (error) {
                    console.error('Error fetching dashboard data:', error);
                    showError('Failed to load dashboard data. Please try again later.');
                }
            }

            function renderEmployees(employees) {
                if (employees.length === 0) {
                    employeeGridElement.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">👥</div>
                            <h3>No employees found</h3>
                            <p>There are no employees registered in the system.</p>
                        </div>
                    `;
                    return;
                }

                employeeGridElement.innerHTML = '';

                employees.forEach(employee => {
                    const card = createEmployeeCard(employee);
                    employeeGridElement.appendChild(card);
                });
            }

            function createEmployeeCard(employee) {
                const div = document.createElement('div');
                div.className = 'employee-card';

                // Get initials for avatar
                const initials = getInitials(employee.first_name, employee.last_name);

                // Format tech stack
                const techStack = employee.tech_stack || 'Not specified';

                // Task counts
                const taskCounts = employee.task_counts || { total: 0, completed: 0, in_progress: 0, pending: 0 };

                div.innerHTML = `
                    <div class="employee-header">
                        <div class="employee-avatar">${initials}</div>
                        <div>
                            <div class="employee-name">${employee.first_name} ${employee.last_name}</div>
                            <div class="employee-email">${employee.email}</div>
                        </div>
                    </div>
                    <div class="tech-stack">
                        <div class="tech-stack-title">Tech Stack</div>
                        <div class="tech-stack-content">${techStack}</div>
                    </div>
                    <div class="task-stats">
                        <div class="task-stat">
                            <div class="task-stat-number">${taskCounts.total || 0}</div>
                            <div class="task-stat-label">Total</div>
                        </div>
                        <div class="task-stat">
                            <div class="task-stat-number">${taskCounts.completed || 0}</div>
                            <div class="task-stat-label">Completed</div>
                        </div>
                        <div class="task-stat">
                            <div class="task-stat-number">${taskCounts.in_progress || 0}</div>
                            <div class="task-stat-label">In Progress</div>
                        </div>
                    </div>
                    <div class="employee-actions">
                        <button class="btn btn-outline btn-sm view-tasks-btn" data-id="${employee.id}">View Tasks</button>
                        <button class="btn btn-primary btn-sm assign-task-btn" data-id="${employee.id}" data-name="${employee.first_name} ${employee.last_name}">Assign Task</button>
                    </div>
                `;

                // Add event listeners
                const assignTaskBtn = div.querySelector('.assign-task-btn');
                assignTaskBtn.addEventListener('click', function() {
                    openAssignTaskModal(this.dataset.id, this.dataset.name);
                });

                const viewTasksBtn = div.querySelector('.view-tasks-btn');
                viewTasksBtn.addEventListener('click', function() {
                    window.location.href = `/dashboard/tasks/?employee_id=${this.dataset.id}`;
                });

                return div;
            }

            async function openAssignTaskModal(employeeId, employeeName) {
                currentEmployeeId = employeeId;
                employeeNameDisplay.textContent = employeeName;

                // Use the unassigned tasks from the dashboard data
                const tasks = window.unassignedTasks || [];

                try {
                    // Populate task select
                    taskSelect.innerHTML = '<option value="">-- Select a task --</option>';
                    tasks.forEach(task => {
                        const option = document.createElement('option');
                        option.value = task.id;
                        option.textContent = task.title;
                        taskSelect.appendChild(option);
                    });

                    // Set default due date to 7 days from now
                    const dueDate = new Date();
                    dueDate.setDate(dueDate.getDate() + 7);
                    document.getElementById('due-date').value = dueDate.toISOString().split('T')[0];

                    // Show modal
                    taskModal.style.display = 'block';
                } catch (error) {
                    console.error('Error loading tasks:', error);
                    alert('Failed to load tasks. Please try again.');
                }
            }

            function closeModal() {
                taskModal.style.display = 'none';
                assignTaskForm.reset();
                currentEmployeeId = null;
            }

            async function assignTask() {
                const token = localStorage.getItem('access_token');
                const taskId = taskSelect.value;
                const dueDate = document.getElementById('due-date').value;
                const note = document.getElementById('note').value;

                if (!taskId) {
                    alert('Please select a task');
                    return;
                }

                try {
                    const response = await fetch('/api/tasks/assign/', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            task_id: taskId,
                            employee_id: currentEmployeeId,
                            due_date: dueDate,
                            note: note
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || 'Failed to assign task');
                    }

                    // Close modal and show success message
                    closeModal();
                    alert('Task assigned successfully!');

                    // Refresh employee data
                    fetchEmployeeData();
                } catch (error) {
                    console.error('Error assigning task:', error);
                    alert(error.message || 'Failed to assign task. Please try again.');
                }
            }

            function showError(message) {
                loadingElement.style.display = 'none';
                errorMessageElement.textContent = message;
                errorMessageElement.style.display = 'block';
            }

            // Helper functions
            function getInitials(firstName, lastName) {
                const firstInitial = firstName ? firstName.charAt(0) : '';
                const lastInitial = lastName ? lastName.charAt(0) : '';
                return (firstInitial + lastInitial).toUpperCase();
            }
        });
    </script>
</body>
</html>
