<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Task Management</title>
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4cc9f0;
            --success-color: #4caf50;
            --warning-color: #ff9800;
            --danger-color: #f44336;
            --dark-color: #212121;
            --light-color: #f8f9fa;
            --gray-color: #6c757d;
            --border-radius: 8px;
            --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: var(--dark-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background-color: white;
            box-shadow: var(--box-shadow);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-color);
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: var(--dark-color);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            position: relative;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: var(--primary-color);
            transition: var(--transition);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .page-title {
            margin: 30px 0;
            color: var(--dark-color);
            text-align: center;
        }

        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 20px;
            text-align: center;
            transition: var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 10px 0;
            color: var(--primary-color);
        }

        .stat-label {
            color: var(--gray-color);
            font-size: 1rem;
        }

        .stat-card.completed {
            border-top: 4px solid var(--success-color);
        }

        .stat-card.completed .stat-number {
            color: var(--success-color);
        }

        .stat-card.in-progress {
            border-top: 4px solid var(--warning-color);
        }

        .stat-card.in-progress .stat-number {
            color: var(--warning-color);
        }

        .stat-card.pending {
            border-top: 4px solid var(--danger-color);
        }

        .stat-card.pending .stat-number {
            color: var(--danger-color);
        }

        .stat-card.total {
            border-top: 4px solid var(--primary-color);
        }

        .employee-list {
            margin-top: 40px;
        }

        .employee-card {
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            margin-bottom: 20px;
            overflow: hidden;
            transition: var(--transition);
        }

        .employee-card:hover {
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        .employee-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .employee-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .employee-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 500;
        }

        .employee-name {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .employee-email {
            color: var(--gray-color);
            font-size: 0.9rem;
        }

        .employee-stats {
            display: flex;
            gap: 15px;
        }

        .employee-stat {
            text-align: center;
            min-width: 80px;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .stat-value.completed {
            color: var(--success-color);
        }

        .stat-value.in-progress {
            color: var(--warning-color);
        }

        .stat-value.pending {
            color: var(--danger-color);
        }

        .stat-value.total {
            color: var(--primary-color);
        }

        .stat-name {
            font-size: 0.8rem;
            color: var(--gray-color);
        }

        .employee-tasks {
            display: none;
            padding: 0 20px 20px;
        }

        .employee-tasks.active {
            display: block;
        }

        .task-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .task-table th,
        .task-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .task-table th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: var(--dark-color);
        }

        .task-table tr:hover {
            background-color: #f8f9fa;
        }

        .task-status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .task-status.completed {
            background-color: rgba(76, 175, 80, 0.1);
            color: var(--success-color);
        }

        .task-status.in-progress {
            background-color: rgba(255, 152, 0, 0.1);
            color: var(--warning-color);
        }

        .task-status.pending {
            background-color: rgba(244, 67, 54, 0.1);
            color: var(--danger-color);
        }

        .task-priority {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .task-priority.low {
            background-color: rgba(76, 175, 80, 0.1);
            color: var(--success-color);
        }

        .task-priority.medium {
            background-color: rgba(33, 150, 243, 0.1);
            color: #2196f3;
        }

        .task-priority.high {
            background-color: rgba(255, 152, 0, 0.1);
            color: var(--warning-color);
        }

        .task-priority.urgent {
            background-color: rgba(244, 67, 54, 0.1);
            color: var(--danger-color);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #eee;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary-color);
            border-radius: 4px;
        }

        .progress-text {
            font-size: 0.8rem;
            color: var(--gray-color);
            margin-top: 5px;
            text-align: right;
        }

        .task-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 12px;
            border-radius: var(--border-radius);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-block;
            text-align: center;
            border: none;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
        }

        .btn-outline:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.8rem;
        }

        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: var(--gray-color);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #ddd;
        }

        .loading {
            text-align: center;
            padding: 40px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(67, 97, 238, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background-color: rgba(244, 67, 54, 0.1);
            color: var(--danger-color);
            padding: 15px;
            border-radius: var(--border-radius);
            margin: 20px 0;
            text-align: center;
        }

        .search-filter {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: var(--transition);
        }

        .search-input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
        }

        .filter-select {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: var(--transition);
            background-color: white;
        }

        .filter-select:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .dashboard-stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .employee-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .employee-stats {
                width: 100%;
                justify-content: space-between;
            }

            .task-table {
                display: block;
                overflow-x: auto;
            }

            .search-filter {
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            .dashboard-stats {
                grid-template-columns: 1fr;
            }

            .employee-stat {
                min-width: 60px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="/" class="logo">Task<span>Flow</span></a>
            <nav class="nav-links">
                <a href="/dashboard/tasks/">Tasks</a>
                <a href="/dashboard/tasks/create/">Create Task</a>
                <a href="/dashboard/employee_dashboard/">Dashboard</a>
                <a href="/auth/logout/">Logout</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title">Employee Task Management</h1>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading data...</p>
        </div>

        <div id="error-message" class="error-message" style="display: none;"></div>

        <div id="dashboard-content" style="display: none;">
            <div class="dashboard-stats">
                <div class="stat-card total">
                    <div class="stat-number" id="total-tasks">0</div>
                    <div class="stat-label">Total Tasks</div>
                </div>
                <div class="stat-card completed">
                    <div class="stat-number" id="completed-tasks">0</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat-card in-progress">
                    <div class="stat-number" id="in-progress-tasks">0</div>
                    <div class="stat-label">In Progress</div>
                </div>
                <div class="stat-card pending">
                    <div class="stat-number" id="pending-tasks">0</div>
                    <div class="stat-label">Pending</div>
                </div>
            </div>

            <div class="actions">
                <div class="search-filter">
                    <input type="text" id="search-input" class="search-input" placeholder="Search employees...">
                    <select id="status-filter" class="filter-select">
                        <option value="all">All Statuses</option>
                        <option value="completed">Completed</option>
                        <option value="in_progress">In Progress</option>
                        <option value="pending">Pending</option>
                    </select>
                </div>
                <a href="/api/tasks/task_create/" class="btn btn-primary">Assign New Task</a>
            </div>

            <div class="employee-list" id="employee-list">
                <!-- Employee cards will be generated here -->
            </div>

            <div id="empty-state" class="empty-state" style="display: none;">
                <div class="empty-state-icon">📋</div>
                <h3>No employees found</h3>
                <p>There are no employees matching your search criteria.</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize variables
            let employeesData = [];
            let filteredEmployees = [];

            // Get DOM elements
            const loadingElement = document.getElementById('loading');
            const errorMessageElement = document.getElementById('error-message');
            const dashboardContentElement = document.getElementById('dashboard-content');
            const employeeListElement = document.getElementById('employee-list');
            const emptyStateElement = document.getElementById('empty-state');
            const searchInputElement = document.getElementById('search-input');
            const statusFilterElement = document.getElementById('status-filter');
            const totalTasksElement = document.getElementById('total-tasks');
            const completedTasksElement = document.getElementById('completed-tasks');
            const inProgressTasksElement = document.getElementById('in-progress-tasks');
            const pendingTasksElement = document.getElementById('pending-tasks');

            // Fetch data from API
            fetchDashboardData();

            // Add event listeners
            searchInputElement.addEventListener('input', filterEmployees);
            statusFilterElement.addEventListener('change', filterEmployees);

            // Functions
            async function fetchDashboardData() {
                const token = localStorage.getItem('access_token');
                if (!token) {
                    showError('You must be logged in to view this page.');
                    return;
                }

                try {
                    const response = await fetch('/api/tasks/dashboard/employee/', {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (response.status === 401) {
                        showError('Your session has expired. Please login again.');
                        setTimeout(() => {
                            window.location.href = '/auth/login/employee/';
                        }, 2000);
                        return;
                    }

                    if (!response.ok) {
                        throw new Error('Failed to fetch dashboard data');
                    }

                    const data = await response.json();

                    // Store employees data
                    employeesData = data.employees;

                    // Update dashboard stats
                    updateDashboardStats(data.task_statistics);

                    // Render employees
                    filteredEmployees = [...employeesData];
                    renderEmployees(filteredEmployees);

                    // Show dashboard content
                    loadingElement.style.display = 'none';
                    dashboardContentElement.style.display = 'block';
                } catch (error) {
                    console.error('Error fetching dashboard data:', error);
                    showError('Failed to load dashboard data. Please try again later.');
                }
            }

            function updateDashboardStats(statistics) {
                totalTasksElement.textContent = statistics.total;
                completedTasksElement.textContent = statistics.completed;
                inProgressTasksElement.textContent = statistics.in_progress;
                pendingTasksElement.textContent = statistics.pending;
            }

            function renderEmployees(employees) {
                if (employees.length === 0) {
                    employeeListElement.innerHTML = '';
                    emptyStateElement.style.display = 'block';
                    return;
                }

                emptyStateElement.style.display = 'none';
                employeeListElement.innerHTML = '';

                employees.forEach(employee => {
                    const employeeCard = createEmployeeCard(employee);
                    employeeListElement.appendChild(employeeCard);
                });

                // Add event listeners to employee headers
                document.querySelectorAll('.employee-header').forEach(header => {
                    header.addEventListener('click', toggleEmployeeTasks);
                });
            }

            function createEmployeeCard(employee) {
                const card = document.createElement('div');
                card.className = 'employee-card';

                // Get employee initials for avatar
                const initials = getInitials(employee.username);

                // Create employee header
                const header = document.createElement('div');
                header.className = 'employee-header';
                header.setAttribute('data-employee-id', employee.id);

                header.innerHTML = `
                    <div class="employee-info">
                        <div class="employee-avatar">${initials}</div>
                        <div>
                            <div class="employee-name">${escapeHtml(employee.username)}</div>
                            <div class="employee-email">${escapeHtml(employee.email || 'No email')}</div>
                        </div>
                    </div>
                    <div class="employee-stats">
                        <div class="employee-stat">
                            <div class="stat-value total">${employee.task_count}</div>
                            <div class="stat-name">Total</div>
                        </div>
                        <div class="employee-stat">
                            <div class="stat-value completed">${employee.completed_tasks}</div>
                            <div class="stat-name">Completed</div>
                        </div>
                        <div class="employee-stat">
                            <div class="stat-value in-progress">${employee.in_progress_tasks}</div>
                            <div class="stat-name">In Progress</div>
                        </div>
                        <div class="employee-stat">
                            <div class="stat-value pending">${employee.pending_tasks}</div>
                            <div class="stat-name">Pending</div>
                        </div>
                    </div>
                `;

                // Create employee tasks section
                const tasksSection = document.createElement('div');
                tasksSection.className = 'employee-tasks';
                tasksSection.id = `employee-tasks-${employee.id}`;

                if (employee.assigned_tasks && employee.assigned_tasks.length > 0) {
                    tasksSection.innerHTML = `
                        <table class="task-table">
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Priority</th>
                                    <th>Due Date</th>
                                    <th>Status</th>
                                    <th>Progress</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${employee.assigned_tasks.map(task => createTaskRow(task)).join('')}
                            </tbody>
                        </table>
                    `;
                } else {
                    tasksSection.innerHTML = `
                        <div class="empty-state" style="padding: 20px 0;">
                            <p>No tasks assigned to this employee.</p>
                        </div>
                    `;
                }

                card.appendChild(header);
                card.appendChild(tasksSection);

                return card;
            }

            function createTaskRow(task) {
                const dueDate = task.due_date ? new Date(task.due_date).toLocaleDateString() : 'No due date';
                const progress = task.progress || 0;

                return `
                    <tr>
                        <td>${escapeHtml(task.title)}</td>
                        <td>
                            <span class="task-priority ${task.priority}">${capitalizeFirstLetter(task.priority)}</span>
                        </td>
                        <td>${dueDate}</td>
                        <td>
                            <span class="task-status ${task.status}">${formatStatus(task.status)}</span>
                        </td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progress}%"></div>
                            </div>
                            <div class="progress-text">${progress}%</div>
                        </td>
                        <td class="task-actions">
                            <a href="/api/tasks/tasks/${task.id}/" class="btn btn-outline btn-sm">View</a>
                        </td>
                    </tr>
                `;
            }

            function toggleEmployeeTasks(event) {
                const employeeId = this.getAttribute('data-employee-id');
                const tasksSection = document.getElementById(`employee-tasks-${employeeId}`);

                // Close all other task sections
                document.querySelectorAll('.employee-tasks.active').forEach(section => {
                    if (section.id !== `employee-tasks-${employeeId}`) {
                        section.classList.remove('active');
                    }
                });

                // Toggle current task section
                tasksSection.classList.toggle('active');
            }

            function filterEmployees() {
                const searchTerm = searchInputElement.value.toLowerCase();
                const statusFilter = statusFilterElement.value;

                filteredEmployees = employeesData.filter(employee => {
                    // Search term filter
                    const matchesSearch =
                        employee.username.toLowerCase().includes(searchTerm) ||
                        (employee.email && employee.email.toLowerCase().includes(searchTerm));

                    // Status filter
                    let matchesStatus = true;
                    if (statusFilter !== 'all') {
                        switch (statusFilter) {
                            case 'completed':
                                matchesStatus = employee.completed_tasks > 0;
                                break;
                            case 'in_progress':
                                matchesStatus = employee.in_progress_tasks > 0;
                                break;
                            case 'pending':
                                matchesStatus = employee.pending_tasks > 0;
                                break;
                        }
                    }

                    return matchesSearch && matchesStatus;
                });

                renderEmployees(filteredEmployees);
            }

            function showError(message) {
                loadingElement.style.display = 'none';
                errorMessageElement.textContent = message;
                errorMessageElement.style.display = 'block';
            }

            // Helper functions
            function getInitials(name) {
                if (!name) return '?';
                return name.split(' ').map(n => n[0]).join('').toUpperCase();
            }

            function formatStatus(status) {
                if (!status) return 'Unknown';
                return status.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
            }

            function capitalizeFirstLetter(string) {
                if (!string) return '';
                return string.charAt(0).toUpperCase() + string.slice(1);
            }

            function escapeHtml(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }
        });
    </script>
</body>
</html>
