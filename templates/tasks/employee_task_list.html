<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .high-priority { background-color: #fff3cd; }
    .urgent-priority { background-color: #f8d7da; }
  </style>
</head>
<body class="bg-light">
  <div class="container py-4">
    <h2 class="mb-4" id="role-title">Loading Tasks...</h2>

    <!-- Filters -->
    <form id="filter-form" class="row g-3 mb-4">
      <div class="col-md-3">
        <input type="text" name="search" class="form-control" placeholder="Search task..." />
      </div>
      <div class="col-md-2">
        <select name="status" class="form-select">
          <option value="">Status</option>
          <option value="pending">Pending</option>
          <option value="in_progress">In Progress</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      <div class="col-md-2">
        <select name="priority" class="form-select">
          <option value="">Priority</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="urgent">Urgent</option>
        </select>
      </div>
      <div class="col-md-2">
        <input type="date" name="due_date_from" class="form-control" placeholder="From Due Date" />
      </div>
      <div class="col-md-2">
        <input type="date" name="due_date_to" class="form-control" placeholder="To Due Date" />
      </div>
      <div class="col-md-1 d-grid">
        <button type="submit" class="btn btn-primary">Filter</button>
      </div>
    </form>

    <!-- Task List Table -->
    <div class="table-responsive">
      <table class="table table-bordered table-striped">
        <thead class="table-dark">
          <tr>
            <th>Title</th>
            <th>Description</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Due Date</th>
          </tr>
        </thead>
        <tbody id="task-table-body">
          <!-- Dynamic Rows Here -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const taskTableBody = document.getElementById('task-table-body');
    const roleTitle = document.getElementById('role-title');

    async function fetchTasks(query = '') {
      try {
        const res = await fetch(`/api/tasks/${query}`, {
          headers: {
            'Authorization': `Bearer ${localStorage.getItem('access')}`  // JWT Token
          }
        });
        const tasks = await res.json();

        // Clear old data
        taskTableBody.innerHTML = '';

        if (tasks.length === 0) {
          taskTableBody.innerHTML = '<tr><td colspan="5">No tasks found.</td></tr>';
        }

        // Debug: Log the tasks data
        console.log('Tasks data in employee_task_list:', tasks);

        tasks.forEach(task => {
          // Debug: Log each task
          console.log('Processing task:', task);

          const tr = document.createElement('tr');

          // Ensure we have valid data for each field
          const title = task.title || 'No title';
          const description = task.description || 'No description';
          const status = task.status || 'pending';
          const priority = task.priority || 'medium';
          const dueDate = task.due_date ? new Date(task.due_date).toLocaleDateString() : '-';

          // Debug: Log the extracted values
          console.log('Extracted values:', { title, description, status, priority, dueDate });

          if (priority === 'urgent') tr.classList.add('urgent-priority');
          else if (priority === 'high') tr.classList.add('high-priority');

          tr.innerHTML = `
            <td>${title}</td>
            <td>${description}</td>
            <td>${status}</td>
            <td>${priority}</td>
            <td>${dueDate}</td>
          `;
          taskTableBody.appendChild(tr);
        });

        // Set title based on role from token (optional improvement: decode JWT)
        const userRole = localStorage.getItem('role'); // Or decode from JWT
        if (userRole === 'Manager') {
          roleTitle.textContent = "All Tasks (Manager View)";
        } else {
          roleTitle.textContent = "My Tasks";
        }

      } catch (error) {
        console.error('Error fetching tasks:', error);
      }
    }

    // Initial load
    fetchTasks();

    // Filter form submit
    document.getElementById('filter-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const formData = new FormData(this);
      const params = new URLSearchParams(formData).toString();
      fetchTasks('?' + params);
    });
  </script>
</body>
</html>
