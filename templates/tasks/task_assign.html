<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assign Task | Task Management System</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #3498db;
      --primary-dark: #2980b9;
      --primary-light: #e6f2ff;
      --secondary-color: #2ecc71;
      --warning-color: #f39c12;
      --danger-color: #e74c3c;
      --dark-bg: #1e1e2f;
      --card-bg: #2c2f48;
      --text-light: #ecf0f1;
      --text-muted: #aaa;
      --border-radius: 8px;
      --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--dark-bg);
      color: var(--text-light);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .page-title {
      font-size: 24px;
      font-weight: 600;
    }

    .back-button {
      background-color: transparent;
      color: var(--text-light);
      border: 1px solid var(--text-light);
      padding: 8px 16px;
      border-radius: var(--border-radius);
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    .back-button:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .card {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      padding: 25px;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      background-color: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--border-radius);
      color: var(--text-light);
      font-size: 16px;
      transition: all 0.3s ease;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.3);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: var(--border-radius);
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background-color: var(--primary-dark);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-block {
      display: block;
      width: 100%;
    }

    .form-row {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .form-row .form-group {
      flex: 1;
      margin-bottom: 0;
    }

    .alert {
      padding: 15px;
      border-radius: var(--border-radius);
      margin-bottom: 20px;
      display: none;
    }

    .alert-success {
      background-color: rgba(46, 204, 113, 0.2);
      border: 1px solid var(--secondary-color);
      color: var(--secondary-color);
    }

    .alert-error {
      background-color: rgba(231, 76, 60, 0.2);
      border: 1px solid var(--danger-color);
      color: var(--danger-color);
    }

    .employee-list {
      max-height: 200px;
      overflow-y: auto;
      margin-top: 10px;
    }

    .employee-item {
      display: flex;
      align-items: center;
      padding: 10px;
      border-radius: var(--border-radius);
      margin-bottom: 5px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .employee-item:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .employee-item.selected {
      background-color: rgba(52, 152, 219, 0.2);
      border: 1px solid var(--primary-color);
    }

    .employee-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--primary-color);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 15px;
      font-weight: 600;
    }

    .employee-info {
      flex: 1;
    }

    .employee-name {
      font-weight: 500;
    }

    .employee-role {
      font-size: 12px;
      color: var(--text-muted);
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
    }

    /* Animation for the success message */
    @keyframes fadeInOut {
      0% { opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; }
    }

    .fade-in-out {
      animation: fadeInOut 5s forwards;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 class="page-title">Assign Task</h1>
      <a href="/api/task_list/" class="back-button">Back to Tasks</a>
    </header>

    <div class="alert alert-success" id="success-alert">
      Task assigned successfully!
    </div>

    <div class="alert alert-error" id="error-alert">
      Error assigning task. Please try again.
    </div>

    <div class="card">
      <form id="assign-task-form">
        <div class="form-group">
          <label for="title">Task Title*</label>
          <input type="text" id="title" name="title" required>
        </div>

        <div class="form-group">
          <label for="description">Description*</label>
          <textarea id="description" name="description" required></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="priority">Priority*</label>
            <select id="priority" name="priority" required>
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
            </select>
          </div>

          <div class="form-group">
            <label for="due_date">Due Date*</label>
            <input type="datetime-local" id="due_date" name="due_date" required>
          </div>
        </div>

        <div class="form-group">
          <label for="assigned_to">Assign To*</label>
          <div id="employee-container" class="employee-list">
            <div class="loading">Loading employees...</div>
          </div>
          <input type="hidden" id="assigned_to" name="assigned_to">
        </div>

        <div class="form-group">
          <label for="tags">Tags (comma separated)</label>
          <input type="text" id="tags" name="tags" placeholder="e.g. frontend, urgent, bug">
        </div>

        <button type="submit" class="btn btn-block">Assign Task</button>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Get token from localStorage
      const token = localStorage.getItem('access_token');
      
      if (!token) {
        window.location.href = '/api/users/manager_login_page/';
        return;
      }

      // Set default due date to tomorrow
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      tomorrow.setHours(17, 0, 0, 0); // 5:00 PM
      document.getElementById('due_date').value = tomorrow.toISOString().slice(0, 16);

      // Fetch employees
      fetchEmployees();

      // Form submission
      document.getElementById('assign-task-form').addEventListener('submit', assignTask);
    });

    async function fetchEmployees() {
      try {
        const response = await fetch('/api/users/list_employee/', {
          headers: {
            'Authorization': `Bearer ${localStorage.getItem('access_token')}`
          }
        });

        if (!response.ok) {
          throw new Error('Failed to fetch employees');
        }

        const employees = await response.json();
        renderEmployees(employees);
      } catch (error) {
        console.error('Error fetching employees:', error);
        document.getElementById('employee-container').innerHTML = `
          <div class="alert alert-error" style="display: block;">
            Failed to load employees. Please refresh the page.
          </div>
        `;
      }
    }

    function renderEmployees(employees) {
      const container = document.getElementById('employee-container');
      
      if (!employees || employees.length === 0) {
        container.innerHTML = '<div class="alert alert-error" style="display: block;">No employees found.</div>';
        return;
      }

      const html = employees.map(employee => {
        const initials = `${employee.first_name.charAt(0)}${employee.last_name.charAt(0)}`.toUpperCase();
        return `
          <div class="employee-item" data-id="${employee.id}" onclick="selectEmployee(this, ${employee.id})">
            <div class="employee-avatar">${initials}</div>
            <div class="employee-info">
              <div class="employee-name">${employee.first_name} ${employee.last_name}</div>
              <div class="employee-role">${employee.email}</div>
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = html;
    }

    function selectEmployee(element, employeeId) {
      // Remove selected class from all employees
      document.querySelectorAll('.employee-item').forEach(item => {
        item.classList.remove('selected');
      });

      // Add selected class to clicked employee
      element.classList.add('selected');

      // Set the employee ID in the hidden input
      document.getElementById('assigned_to').value = employeeId;
    }

    async function assignTask(event) {
      event.preventDefault();

      const form = event.target;
      const assignedTo = document.getElementById('assigned_to').value;

      if (!assignedTo) {
        showError('Please select an employee to assign the task to.');
        return;
      }

      // Collect form data
      const formData = {
        title: document.getElementById('title').value,
        description: document.getElementById('description').value,
        priority: document.getElementById('priority').value,
        due_date: document.getElementById('due_date').value,
        assigned_to: assignedTo,
        tags: document.getElementById('tags').value
      };

      try {
        const response = await fetch('/api/tasks/create/', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${localStorage.getItem('access_token')}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        const data = await response.json();

        if (!response.ok) {
          let errorMessage = 'Failed to assign task.';
          if (data.non_field_errors) {
            errorMessage = data.non_field_errors.join(' ');
          } else if (typeof data === 'object') {
            errorMessage = Object.entries(data)
              .map(([key, value]) => `${key}: ${Array.isArray(value) ? value.join(' ') : value}`)
              .join('\n');
          }
          throw new Error(errorMessage);
        }

        // Show success message
        showSuccess('Task assigned successfully!');
        
        // Reset form
        form.reset();
        document.querySelectorAll('.employee-item').forEach(item => {
          item.classList.remove('selected');
        });
        document.getElementById('assigned_to').value = '';

        // Set default due date again
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        tomorrow.setHours(17, 0, 0, 0);
        document.getElementById('due_date').value = tomorrow.toISOString().slice(0, 16);

      } catch (error) {
        console.error('Error assigning task:', error);
        showError(error.message);
      }
    }

    function showSuccess(message) {
      const alert = document.getElementById('success-alert');
      alert.textContent = message;
      alert.style.display = 'block';
      alert.classList.add('fade-in-out');
      
      setTimeout(() => {
        alert.style.display = 'none';
        alert.classList.remove('fade-in-out');
      }, 5000);
    }

    function showError(message) {
      const alert = document.getElementById('error-alert');
      alert.textContent = message;
      alert.style.display = 'block';
      alert.classList.add('fade-in-out');
      
      setTimeout(() => {
        alert.style.display = 'none';
        alert.classList.remove('fade-in-out');
      }, 5000);
    }
  </script>
</body>
</html>
