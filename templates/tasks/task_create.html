<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Task</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #f1f1f1;
      padding: 40px;
    }
    h1 {
      text-align: center;
      color: #00bfff;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: #e0e0e0;
    }
    input[type="text"],
    input[type="date"],
    textarea,
    input[type="file"] {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      background: #2a2a2a;
      color: #ffffff;
      border: 1px solid #444;
      border-radius: 5px;
      box-sizing: border-box;
    }
    input[type="file"] {
      padding: 8px;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #00bfff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #009acd;
    }
    .message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
    .message.error { color: #ff6b6b; }
    .message.success { color: #32cd32; }
  </style>
</head>
<body>

  <h1>Create New Task</h1>
  <div class="container">
    <form id="taskForm">
      <label for="title">Task Title</label>
      <input type="text" id="title" name="title" required>

      <label for="description">Description</label>
      <textarea id="description" name="description" required></textarea>

      <label for="due_date">Due Date</label>
      <input type="date" id="due_date" name="due_date" required>

      <label for="document">Attach Document</label>
      <input type="file" id="document" name="document" accept=".pdf,.doc,.docx">

      <button type="submit">Create Task</button>
    </form>
    <p id="message" class="message"></p>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("taskForm").addEventListener("submit", createTask);
    });

    async function createTask(e) {
      e.preventDefault();
      const token = localStorage.getItem("access_token");
      const msg = document.getElementById("message");
      msg.textContent = ""; msg.className = "message";

      const form = document.getElementById("taskForm");
      const formData = new FormData(form);

      try {
        const res = await fetch("http://127.0.0.1:8000/api/tasks/create/", {
          method: "POST",
          headers: { "Authorization": `Bearer ${token}` },
          body: formData
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Failed to create task");

        msg.textContent = "Task created successfully!";
        msg.className = "message success";
        form.reset();
      } catch (err) {
        console.error(err);
        msg.textContent = err.message;
        msg.className = "message error";
      }
    }
  </script>

</body>
</html>
