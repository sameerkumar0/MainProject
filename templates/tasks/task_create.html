<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Task</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 40px;
    }
    h1 {
      text-align: center;
      color: #007BFF;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input[type="text"],
    input[type="date"],
    textarea,
    select,
    input[type="file"] {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #007BFF;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
    .message.error { color: red; }
    .message.success { color: green; }
  </style>
</head>
<body>

  <h1>Create New Task</h1>
  <div class="container">
    <form id="taskForm">
      <label for="title">Task Title</label>
      <input type="text" id="title" name="title" required>

      <label for="description">Description</label>
      <textarea id="description" name="description" required></textarea>

      <label for="assigned_to">Assign To (Employee)</label>
      <select id="assigned_to" name="assigned_to" required>
        <option value="">Loading employees...</option>
      </select>

      <label for="due_date">Due Date</label>
      <input type="date" id="due_date" name="due_date" required>

      <label for="document">Attach Document (optional)</label>
      <input type="file" id="document" name="document" accept=".pdf,.doc,.docx">

      <button type="submit">Assign Task</button>
    </form>
    <p id="message" class="message"></p>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      fetchEmployees();
      document.getElementById("taskForm").addEventListener("submit", createTask);
    });

    async function fetchEmployees() {
      const token = localStorage.getItem("access_token");
      try {
        const res = await fetch("http://127.0.0.1:8000/api/users/list_employee/", {
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (!res.ok) throw new Error("Failed to load employees");
        const employees = await res.json();
        const sel = document.getElementById("assigned_to");
        sel.innerHTML = employees.map(emp =>
          `<option value="${emp.id}">${emp.first_name} ${emp.last_name} (${emp.username})</option>`
        ).join("");
      } catch (err) {
        console.error(err);
        document.getElementById("message").textContent = err.message;
        document.getElementById("message").className = "message error";
      }
    }

    async function createTask(e) {
      e.preventDefault();
      const token = localStorage.getItem("access_token");
      const msg = document.getElementById("message");
      msg.textContent = ""; msg.className = "message";

      const form = document.getElementById("taskForm");
      const formData = new FormData(form);

      try {
        const res = await fetch("http://127.0.0.1:8000/api/tasks/create/", {
          method: "POST",
          headers: { "Authorization": `Bearer ${token}` },
          body: formData
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.assigned_to || data.detail || "Failed to create task");

        msg.textContent = "Task assigned successfully!";
        msg.className = "message success";
        form.reset();
      } catch (err) {
        console.error(err);
        msg.textContent = err.message;
        msg.className = "message error";
      }
    }
  </script>

</body>
</html>
