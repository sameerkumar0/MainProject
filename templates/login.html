<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        /* Dark theme styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: #1e1e1e;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 350px;
        }

        h2 {
            margin-bottom: 1rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 1rem;
        }

        input {
            width: 100%;
            padding: 10px;
            background: #292929;
            border: 1px solid #444;
            border-radius: 5px;
            color: white;
        }

        input::placeholder {
            color: #bbb;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s ease-in-out;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #444;
            cursor: not-allowed;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #bbb;
            font-size: 1.2rem;
        }

        .toggle-password:hover {
            color: white;
        }

        .register-link {
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .register-link a {
            color: #007BFF;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: red;
            font-size: 0.9rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" placeholder="Username" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
                <span class="toggle-password" onclick="togglePassword()">👁</span>
            </div>
            <button type="submit" id="loginButton">Login</button>
            <p class="error-message" id="errorMessage"></p>
            <p class="register-link">Don't have an account? <a href="{% url 'manager_register' %}">Register</a></p>
        </form>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const loginButton = document.getElementById("loginButton");
            const errorMessage = document.getElementById("errorMessage");
            errorMessage.textContent = ""; // Clear previous error message

            const formData = {
                username: document.getElementById("username").value,
                password: document.getElementById("password").value
            };

            loginButton.disabled = true; // Disable button to prevent multiple clicks

            try {
                const response = await fetch("http://127.0.0.1:8000/api/users/login/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();
                loginButton.disabled = false; // Re-enable button

                if (response.ok) {
                    localStorage.setItem("access", data.access);  // Store token
                    localStorage.setItem("refresh", data.refresh);

                    // Redirect to the URL provided by the backend
                    if (data.redirect_url) {
                        window.location.href = data.redirect_url;
                    } else {
                        errorMessage.textContent = "Login successful, but no redirect URL provided!";
                    }
                } else {
                    errorMessage.textContent = data.error || "Invalid credentials";
                }
            } catch (error) {
                console.error("Error:", error);
                errorMessage.textContent = "Something went wrong. Please try again.";
                loginButton.disabled = false;
            }
        });

        // Toggle Password Visibility
        function togglePassword() {
            const passwordField = document.getElementById("password");
            passwordField.type = passwordField.type === "password" ? "text" : "password";
        }
    </script>
</body>
</html>
