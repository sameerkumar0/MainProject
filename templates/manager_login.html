<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manager Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #2c1d1d;
      --header-bg: #1e1e1e;
      --text-color: white;
      --accent-color: #007BFF;
      --accent-hover: #0056b3;
      --card-bg: rgba(255, 255, 255, 0.1);
      --shadow-color: rgba(0, 0, 0, 0.2);
      --input-bg: #333;
      --input-focus-bg: #444;
    }

    .light-theme {
      --bg-color: #f5f5f5;
      --header-bg: #ffffff;
      --text-color: #333333;
      --card-bg: rgba(0, 0, 0, 0.05);
      --shadow-color: rgba(0, 0, 0, 0.1);
      --input-bg: #e9e9e9;
      --input-focus-bg: #dedede;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: linear-gradient(135deg, var(--bg-color) 0%, rgba(30, 30, 60, 0.8) 100%);
      background-size: 400% 400%;
      background-attachment: fixed;
      animation: gradientBG 15s ease infinite;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px var(--shadow-color);
      width: 100%;
      max-width: 400px;
      text-align: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      animation: fadeIn 0.5s ease-out;
      margin: 20px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .container:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px var(--shadow-color);
    }

    h2 {
      margin-bottom: 20px;
      font-size: 28px;
      font-weight: 600;
      background: linear-gradient(to right, var(--accent-color), #00c6ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s ease;
      background: var(--input-bg);
      color: var(--text-color);
      border: 1px solid transparent;
    }

    input:focus {
      background: var(--input-focus-bg);
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
    }

    input::placeholder {
      color: var(--text-color);
      opacity: 0.6;
    }

    button {
      width: 100%;
      padding: 12px 15px;
      border: none;
      border-radius: 8px;
      background: var(--accent-color);
      color: white;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      margin-top: 10px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    button::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 5px;
      height: 5px;
      background: rgba(255, 255, 255, 0.5);
      opacity: 0;
      border-radius: 100%;
      transform: scale(1, 1) translate(-50%);
      transform-origin: 50% 50%;
    }

    button:focus:not(:active)::after {
      animation: ripple 1s ease-out;
    }

    @keyframes ripple {
      0% {
        transform: scale(0, 0);
        opacity: 0.5;
      }
      20% {
        transform: scale(25, 25);
        opacity: 0.3;
      }
      100% {
        opacity: 0;
        transform: scale(40, 40);
      }
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-3px);
      box-shadow: 0 7px 15px rgba(0, 123, 255, 0.3);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 3px 8px rgba(0, 123, 255, 0.2);
    }

    .register-link {
      margin-top: 25px;
      font-size: 14px;
      opacity: 0.9;
    }

    .register-link a {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: bold;
      transition: all 0.3s ease;
      position: relative;
    }

    .register-link a::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 2px;
      bottom: -2px;
      left: 0;
      background-color: var(--accent-color);
      transform: scaleX(0);
      transition: transform 0.3s ease;
    }

    .register-link a:hover {
      color: var(--accent-hover);
    }

    .register-link a:hover::after {
      transform: scaleX(1);
    }

    .forgot-password-link {
      margin-top: 10px;
      font-size: 14px;
      opacity: 0.9;
    }

    .forgot-password-link a {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: bold;
      transition: all 0.3s ease;
      position: relative;
    }

    .forgot-password-link a::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 2px;
      bottom: -2px;
      left: 0;
      background-color: var(--accent-color);
      transform: scaleX(0);
      transition: transform 0.3s ease;
    }

    .forgot-password-link a:hover {
      color: var(--accent-hover);
    }

    .forgot-password-link a:hover::after {
      transform: scaleX(1);
    }

    /* Theme toggle button */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--card-bg);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1000;
      box-shadow: 0 2px 10px var(--shadow-color);
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .theme-toggle:hover {
      background-color: var(--accent-color);
      transform: rotate(180deg);
    }

    .light-icon, .dark-icon {
      font-size: 20px;
      transition: opacity 0.3s ease;
    }

    body.light-theme .dark-icon {
      display: inline;
    }

    body.light-theme .light-icon {
      display: none;
    }

    body:not(.light-theme) .light-icon {
      display: inline;
    }

    body:not(.light-theme) .dark-icon {
      display: none;
    }

    /* Logo styles */
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .logo-icon {
      font-size: 2rem;
      animation: bounce 2s ease infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
      40% {transform: translateY(-10px);}
      60% {transform: translateY(-5px);}
    }

    .logo-text {
      font-size: 1.5rem;
      font-weight: bold;
      background: linear-gradient(to right, var(--accent-color), #00c6ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 4s linear infinite;
      background-size: 200% auto;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    /* Particles background */
    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: -1;
    }

    /* Home button */
    .home-button {
      position: fixed;
      top: 20px;
      left: 20px;
      background: var(--card-bg);
      border: none;
      border-radius: 8px;
      padding: 8px 15px;
      color: var(--text-color);
      font-weight: 500;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 2px 10px var(--shadow-color);
      transition: all 0.3s ease;
      z-index: 1000;
    }

    .home-button:hover {
      background: var(--accent-color);
      transform: translateY(-3px);
      box-shadow: 0 5px 15px var(--shadow-color);
    }
  </style>
</head>
<body>
    <!-- Particles background -->
    <div id="particles-js"></div>

    <!-- Theme toggle button -->
    <button id="theme-toggle" class="theme-toggle">
        <span class="light-icon">☀️</span>
        <span class="dark-icon">🌙</span>
    </button>

    <!-- Home button -->
    <a href="{% url 'home' %}" class="home-button">
        <span>←</span> Home
    </a>

    <div class="container">
        <div class="logo">
            <span class="logo-icon">📋</span>
            <span class="logo-text">Task Management</span>
        </div>

        <h2>Manager Login</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <input type="hidden" id="csrf_token" value="{{ csrf_token }}">
            <button type="submit">Login</button>
        </form>

        <!-- Register and Forgot Password Links -->
        <div class="register-link">
            Don't have an account? <a href="{% url 'manager_register' %}">Register</a>
        </div>
        <div class="forgot-password-link">
            <a href="/auth/forgot-password/">Forgot Password?</a>
        </div>
    </div>

    <!-- Particles.js library -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <script>
        // Initialize particles.js
        document.addEventListener('DOMContentLoaded', function() {
            particlesJS('particles-js', {
                particles: {
                    number: { value: 80, density: { enable: true, value_area: 800 } },
                    color: { value: "#007BFF" },
                    opacity: { value: 0.5 },
                    size: { value: 3, random: true },
                    line_linked: {
                        enable: true,
                        distance: 150,
                        color: "#007BFF",
                        opacity: 0.4,
                        width: 1
                    },
                    move: {
                        enable: true,
                        speed: 2,
                        direction: "none",
                        out_mode: "out"
                    }
                },
                interactivity: {
                    events: {
                        onhover: { enable: true, mode: "grab" },
                        onclick: { enable: true, mode: "push" }
                    },
                    modes: {
                        grab: { distance: 140, line_linked: { opacity: 1 } },
                        push: { particles_nb: 4 }
                    }
                },
                retina_detect: true
            });

            // Theme toggle functionality
            const toggleBtn = document.getElementById('theme-toggle');

            // Check for saved theme preference
            const savedTheme = localStorage.getItem("theme");

            if (savedTheme === "light") {
                document.body.classList.add("light-theme");
            }

            // Toggle theme when button is clicked
            toggleBtn.addEventListener("click", function() {
                document.body.classList.toggle("light-theme");

                // Save preference to localStorage
                if (document.body.classList.contains("light-theme")) {
                    localStorage.setItem("theme", "light");
                } else {
                    localStorage.setItem("theme", "dark");
                }
            });
        });

        // Form submission handler
        document.getElementById("loginForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const formData = {
                username: document.getElementById("username").value,
                password: document.getElementById("password").value
            };

            const csrfToken = document.getElementById("csrf_token").value;

            try {
                const response = await fetch("/api/users/login/manager/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": csrfToken
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    // Store tokens and role in localStorage
                    localStorage.setItem("access_token", data.access);
                    localStorage.setItem("refresh_token", data.refresh);
                    localStorage.setItem("role", data.role);

                    // Redirect to manager dashboard
                    window.location.href = "/auth/manager/employees/";
                } else {
                    alert(data.error || "Login failed");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Something went wrong. Please try again.");
            }
        });
    </script>

</body>
</html>
