<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard</title>
    <script>
        async function loadDashboard() {
            const token = localStorage.getItem("access");

            const response = await fetch("http://127.0.0.1:8000/api/users/manager/dashboard/", {
                method: "GET",
                headers: { "Authorization": `Bearer ${token}` }
            });

            if (!response.ok) {
                alert("Failed to load dashboard");
                return;
            }

            const data = await response.json();
            document.getElementById("manager-name").innerText = data.manager.name;

            // Display Employees
            let employeeTable = document.getElementById("employee-table");
            data.employees.forEach(emp => {
                let row = `<tr>
                    <td>${emp.first_name} ${emp.last_name}</td>
                    <td>${emp.email}</td>
                    <td>${emp.tech_stacks.join(", ")}</td>
                </tr>`;
                employeeTable.innerHTML += row;
            });
        }

        document.addEventListener("DOMContentLoaded", loadDashboard);
    </script>
</head>
<body>

    <h2>Welcome, <span id="manager-username"></span></h2>

    <h3>Employees & Tech Stacks</h3>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Tech Stack</th>
        </tr>
        <tbody id="employee-table"></tbody>
    </table>

</body>
</html>
