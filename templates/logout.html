<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #422b2b;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .logout-container {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 30px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        h1 {
            margin-bottom: 20px;
            color: #007BFF;
        }
        p {
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            margin: 0 10px;
        }
        .btn-primary {
            background-color: #007BFF;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        .buttons {
            display: flex;
            justify-content: center;
        }
        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        .success {
            background-color: rgba(40, 167, 69, 0.2);
            border: 1px solid #28a745;
            color: #28a745;
        }
        .error {
            background-color: rgba(220, 53, 69, 0.2);
            border: 1px solid #dc3545;
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <h1>Logout Confirmation</h1>
        <p>Are you sure you want to logout from your account?</p>
        
        <div class="buttons">
            <button id="cancelBtn" class="btn btn-secondary">Cancel</button>
            <button id="logoutBtn" class="btn btn-primary">Logout</button>
        </div>
        
        <div id="message" class="message"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const logoutBtn = document.getElementById('logoutBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            const messageDiv = document.getElementById('message');
            
            // Get CSRF token
            async function getCSRFToken() {
                try {
                    const response = await fetch('/api/users/csrf/');
                    const data = await response.json();
                    return data.csrfToken;
                } catch (error) {
                    console.error('Error fetching CSRF token:', error);
                    return null;
                }
            }
            
            // Handle logout
            logoutBtn.addEventListener('click', async function() {
                try {
                    const csrfToken = await getCSRFToken();
                    const refreshToken = localStorage.getItem('refresh_token');
                    
                    if (!refreshToken) {
                        showMessage('No active session found.', 'error');
                        return;
                    }
                    
                    const response = await fetch('/api/users/logout/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${localStorage.getItem('access_token')}`,
                            'X-CSRFToken': csrfToken
                        },
                        body: JSON.stringify({
                            refresh_token: refreshToken
                        })
                    });
                    
                    if (response.ok) {
                        // Clear local storage
                        localStorage.removeItem('access_token');
                        localStorage.removeItem('refresh_token');
                        localStorage.removeItem('role');
                        
                        showMessage('Logout successful! Redirecting to home page...', 'success');
                        
                        // Redirect to home page after a short delay
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 2000);
                    } else {
                        const data = await response.json();
                        showMessage(data.error || 'Logout failed. Please try again.', 'error');
                    }
                } catch (error) {
                    console.error('Error during logout:', error);
                    showMessage('An error occurred during logout.', 'error');
                }
            });
            
            // Handle cancel button
            cancelBtn.addEventListener('click', function() {
                // Determine where to redirect based on user role
                const role = localStorage.getItem('role');
                if (role === 'Manager') {
                    window.location.href = '/api/users/dashboard/';
                } else if (role === 'Employee') {
                    window.location.href = '/api/users/emp_dashboard/';
                } else {
                    window.location.href = '/';
                }
            });
            
            // Helper function to show messages
            function showMessage(text, type) {
                messageDiv.textContent = text;
                messageDiv.className = `message ${type}`;
                messageDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
