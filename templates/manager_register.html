<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Registration</title>
    
    <!-- Bootstrap 5 Dark Theme -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS (if needed) -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    <style>
        /* Full-page dark background */
        .register-page {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #121212; /* Dark background */
            color: #fff; /* Light text */
            position: relative;
        }

        /* Center registration form */
        .register-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 400px;
        }

        /* Card Styling */
        .card {
            background-color: #1e1e1e; /* Dark card */
            border: 1px solid #333;
            color: white;
        }

        .form-control {
            background-color: #222;
            border: 1px solid #444;
            color: white;
        }

        .form-control:focus {
            background-color: #333;
            border-color: #007bff;
            color: white;
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #004085;
        }

        /* Navbar and Footer Styling */
        .navbar, .footer {
            background-color: #000;
        }

        /* Fixed Footer */
        .footer {
            text-align: center;
            color: white;
            padding: 15px 0;
            width: 100%;
            position: absolute;
            bottom: 0;
        }
    </style>
</head>
<body class="register-page"> <!-- Class added to target this page only -->

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">My Website</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login/">Login</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/register/">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Registration Form (Fixed in Center) -->
    <div class="container register-content">
        <div class="card shadow-lg">
            <div class="card-body">
                <h2 class="text-center mb-4">Manager Registration</h2>
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" name="username" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Register</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Fixed Footer -->
    <footer class="footer">
        &copy; 2025 My Website. All rights reserved.
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
