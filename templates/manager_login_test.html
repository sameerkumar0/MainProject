<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Login Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Manager Login Test</h1>
    <div id="login-form">
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username">
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password">
        </div>
        <button id="login-btn">Login</button>
        <div id="error-message" class="error" style="display: none;"></div>
    </div>

    <div id="token-display" style="margin-top: 20px; display: none;">
        <h2>Login Successful</h2>
        <p>Token has been stored in localStorage.</p>
        <p>Access Token: <span id="token-preview"></span>...</p>
        <button id="dashboard-btn">Go to Dashboard</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginBtn = document.getElementById('login-btn');
            const dashboardBtn = document.getElementById('dashboard-btn');
            const errorMessage = document.getElementById('error-message');
            const tokenDisplay = document.getElementById('token-display');
            const tokenPreview = document.getElementById('token-preview');
            const loginForm = document.getElementById('login-form');

            // Check if already logged in
            const token = localStorage.getItem('access_token') || localStorage.getItem('access');
            if (token) {
                loginForm.style.display = 'none';
                tokenDisplay.style.display = 'block';
                tokenPreview.textContent = token.substring(0, 20);
            }

            loginBtn.addEventListener('click', async function() {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                if (!username || !password) {
                    showError('Please enter both username and password');
                    return;
                }

                try {
                    const response = await fetch('/api/users/login/manager/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.detail || 'Login failed');
                    }

                    // Store tokens
                    localStorage.setItem('access_token', data.access);
                    localStorage.setItem('refresh_token', data.refresh);
                    
                    // Show success
                    loginForm.style.display = 'none';
                    tokenDisplay.style.display = 'block';
                    tokenPreview.textContent = data.access.substring(0, 20);
                    
                    // Clear error
                    errorMessage.style.display = 'none';
                } catch (error) {
                    showError(error.message);
                }
            });

            dashboardBtn.addEventListener('click', function() {
                window.location.href = '/auth/manager/employees/';
            });

            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
