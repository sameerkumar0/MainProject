<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      color: #333;
      margin: 0;
      padding: 0;
    }

    .navbar {
      background-color: #2c3e50;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
    }

    .navbar .user-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .navbar .user-info img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid white;
    }

    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px;
    }

    .header {
      background-color: #3498db;
      color: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 20px;
    }

    .task-stats {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .stat {
      background-color: white;
      border-left: 5px solid #3498db;
      border-radius: 6px;
      padding: 15px 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      flex: 1;
      min-width: 200px;
      text-align: center;
    }

    .task-list {
      display: grid;
      gap: 15px;
    }

    .task-card {
      background-color: white;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .task-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 10px;
    }

    .task-info {
      font-size: 0.9rem;
      color: #7f8c8d;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 1.2rem;
      color: #7f8c8d;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <h2>Employee Dashboard</h2>
    <div class="user-info">
      <span id="employeeName">Loading...</span>
      <img id="employeePhoto" src="" alt="Profile Photo">
    </div>
  </div>

  <div class="container">
    <div class="header">
      <h3>My Assigned Tasks</h3>
      <p>Track progress of all your tasks here</p>
    </div>

    <div id="statsContainer" class="task-stats"></div>

    <div id="loading" class="loading">Loading tasks...</div>

    <div id="taskList" class="task-list" style="display: none;"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      fetchDashboard();
    });

    async function fetchDashboard() {
      const token = localStorage.getItem("access_token");

      try {
        const response = await fetch("/api/users/employee_dashboard/", {
          headers: {
            Authorization: `Bearer ${token}`
          }
        });

        const data = await response.json();

        if (!response.ok) {
          document.getElementById("loading").textContent = "Failed to load tasks.";
          return;
        }

        renderStats(data.task_stats);
        renderTasks(data.tasks);
        renderUser(); // optional call if user info is saved separately

        document.getElementById("loading").style.display = "none";
        document.getElementById("taskList").style.display = "grid";

      } catch (error) {
        document.getElementById("loading").textContent = "Error loading dashboard.";
        console.error(error);
      }
    }

    function renderStats(stats) {
      const container = document.getElementById("statsContainer");
      container.innerHTML = `
        <div class="stat"><strong>Total Tasks:</strong> ${stats.total}</div>
        <div class="stat"><strong>Completed:</strong> ${stats.completed}</div>
        <div class="stat"><strong>In Progress:</strong> ${stats.in_progress}</div>
        <div class="stat"><strong>Pending:</strong> ${stats.pending}</div>
      `;
    }

    function renderTasks(tasks) {
      const list = document.getElementById("taskList");
      list.innerHTML = "";

      if (!tasks.length) {
        list.innerHTML = "<p class='loading'>No tasks assigned yet.</p>";
        return;
      }

      tasks.forEach(task => {
        const card = document.createElement("div");
        card.className = "task-card";
        card.innerHTML = `
          <div class="task-title">${task.title}</div>
          <div class="task-info">Due: ${task.due_date} | Status: ${task.status}</div>
        `;
        list.appendChild(card);
      });
    }

    function renderUser() {
      // You can replace this with actual user info stored in localStorage or fetch from `/api/user/me/`
      const name = localStorage.getItem("user_name") || "Employee Name";
      const photo = localStorage.getItem("profile_photo") || "/static/default-avatar.png";

      document.getElementById("employeeName").textContent = name;
      document.getElementById("employeePhoto").src = photo;
    }
  </script>

</body>
</html>
