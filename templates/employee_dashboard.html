<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-7xl mx-auto space-y-8">

    <!-- User Profile -->
    <div class="flex items-center space-x-4 bg-white p-4 rounded-xl shadow">
      <img id="profile-photo" class="w-16 h-16 rounded-full" src="" alt="Profile" />
      <div>
        <h2 id="user-name" class="text-xl font-bold"></h2>
        <p id="user-email" class="text-sm text-gray-500"></p>
      </div>
    </div>

    <!-- Metrics -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-xl shadow text-center">
        <h3 class="text-sm text-gray-500">Total</h3>
        <p id="metric-total" class="text-2xl font-bold">0</p>
      </div>
      <div class="bg-yellow-100 p-4 rounded-xl shadow text-center">
        <h3 class="text-sm text-gray-600">Pending</h3>
        <p id="metric-pending" class="text-2xl font-bold">0</p>
      </div>
      <div class="bg-blue-100 p-4 rounded-xl shadow text-center">
        <h3 class="text-sm text-gray-600">In Progress</h3>
        <p id="metric-in-progress" class="text-2xl font-bold">0</p>
      </div>
      <div class="bg-green-100 p-4 rounded-xl shadow text-center">
        <h3 class="text-sm text-gray-600">Completed</h3>
        <p id="metric-completed" class="text-2xl font-bold">0</p>
      </div>
    </div>

    <!-- Priority Tasks -->
    <div class="bg-white p-4 rounded-xl shadow">
      <h2 class="text-lg font-semibold mb-2">Top Priority Tasks</h2>
      <ul id="priority-tasks" class="space-y-2"></ul>
    </div>

    <!-- Calendar -->
    <div class="bg-white p-4 rounded-xl shadow">
      <h2 class="text-lg font-semibold mb-2">Upcoming Deadlines</h2>
      <div id="calendar-preview" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    </div>

    <!-- Recent Activities -->
    <div class="bg-white p-4 rounded-xl shadow">
      <h2 class="text-lg font-semibold mb-2">Recent Activities</h2>
      <ul id="recent-activities" class="space-y-2 text-sm text-gray-700"></ul>
    </div>

    <!-- Task Progress -->
    <div class="bg-white p-4 rounded-xl shadow">
      <h2 class="text-lg font-semibold mb-2">Recent Task Progress</h2>
      <ul id="recent-progress" class="space-y-2 text-sm text-gray-700"></ul>
    </div>

    <!-- Notifications -->
    <div class="bg-white p-4 rounded-xl shadow">
      <h2 class="text-lg font-semibold mb-2">Notifications</h2>
      <ul id="recent-notifications" class="space-y-2 text-sm text-gray-700"></ul>
    </div>

    <!-- All Tasks -->
    <div class="bg-white p-4 rounded-xl shadow">
      <h2 class="text-lg font-semibold mb-2">All Assigned Tasks</h2>
      <ul id="all-tasks" class="space-y-2 text-sm text-gray-700"></ul>
    </div>
  </div>

  <script>
    // Fetch dashboard data from API
    fetch('/api/tasks/dashboard/employee/')
      .then(res => res.json())
      .then(data => {
        // User
        document.getElementById('user-name').textContent = `${data.user.first_name} ${data.user.last_name}`;
        document.getElementById('user-email').textContent = data.user.email;
        document.getElementById('profile-photo').src = data.user.profile_photo;

        // Metrics
        document.getElementById('metric-total').textContent = data.metrics.total;
        document.getElementById('metric-pending').textContent = data.metrics.pending;
        document.getElementById('metric-in-progress').textContent = data.metrics.in_progress;
        document.getElementById('metric-completed').textContent = data.metrics.completed;

        // Priority Tasks
        data.priority_tasks.forEach(task => {
          const li = document.createElement('li');
          li.innerHTML = `<strong>${task.title}</strong> - due: ${task.due_date}`;
          document.getElementById('priority-tasks').appendChild(li);
        });

        // Calendar Tasks
        for (const [date, tasks] of Object.entries(data.calendar_tasks)) {
          const div = document.createElement('div');
          div.classList.add("bg-gray-50", "p-2", "rounded-md");
          div.innerHTML = `<strong>${date}</strong><ul class="list-disc ml-4">${tasks.map(t => `<li>${t.title}</li>`).join('')}</ul>`;
          document.getElementById('calendar-preview').appendChild(div);
        }

        // Activities
        data.recent_activities.forEach(activity => {
          const li = document.createElement('li');
          li.textContent = activity.description;
          document.getElementById('recent-activities').appendChild(li);
        });

        // Task Progress
        data.recent_progress.forEach(progress => {
          const li = document.createElement('li');
          li.textContent = `${progress.task_title} - ${progress.progress_update}`;
          document.getElementById('recent-progress').appendChild(li);
        });

        // Notifications
        data.recent_notifications.forEach(notification => {
          const li = document.createElement('li');
          li.textContent = notification.message;
          document.getElementById('recent-notifications').appendChild(li);
        });

        // All Tasks
        data.all_tasks.forEach(task => {
          const li = document.createElement('li');
          li.textContent = `${task.title} [${task.status_display}]`;
          document.getElementById('all-tasks').appendChild(li);
        });
      });
  </script>
</body>
</html>
