<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 2rem;
        }
        .profile-container {
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 1.5rem;
            max-width: 500px;
            margin: 0 auto;
            background-color: #f9f9f9;
        }
        .profile-container h2 {
            text-align: center;
        }
        .profile-info {
            margin-top: 1rem;
        }
        .profile-info p {
            margin: 0.5rem 0;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <h2>Employee Profile</h2>
        <div class="profile-info" id="profile">
            <!-- Profile details will be injected here -->
        </div>
    </div>

    <script>
        const token = localStorage.getItem('accessToken'); // Store JWT token in localStorage

        async function fetchEmployeeProfile() {
            try {
                const response = await fetch('/api/users/employee_profile/', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch profile. Status: ' + response.status);
                }

                const data = await response.json();

                // Populate profile info
                const profileDiv = document.getElementById('profile');
                profileDiv.innerHTML = `
                    <p><strong>First Name:</strong> ${data.first_name}</p>
                    <p><strong>Last Name:</strong> ${data.last_name}</p>
                    <p><strong>Username:</strong> ${data.username}</p>
                    <p><strong>Email:</strong> ${data.email}</p>
                    <p><strong>Phone Number:</strong> ${data.phone_number}</p>
                    <p><strong>Tech Stack:</strong> ${data.tech_stack}</p>
                `;
            } catch (error) {
                console.error('Error fetching employee profile:', error);
                document.getElementById('profile').innerHTML = `<p style="color: red;">Error loading profile.</p>`;
            }
        }

        fetchEmployeeProfile();
    </script>
</body>
</html>
