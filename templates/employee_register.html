<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Employee Registration</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #2c1d1d;
      --header-bg: #1e1e1e;
      --text-color: white;
      --accent-color: #007BFF;
      --accent-hover: #0056b3;
      --card-bg: rgba(255, 255, 255, 0.1);
      --shadow-color: rgba(0, 0, 0, 0.2);
      --input-bg: #333;
      --input-focus-bg: #444;
    }

    .light-theme {
      --bg-color: #f5f5f5;
      --header-bg: #ffffff;
      --text-color: #333333;
      --card-bg: rgba(0, 0, 0, 0.05);
      --shadow-color: rgba(0, 0, 0, 0.1);
      --input-bg: #e9e9e9;
      --input-focus-bg: #dedede;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: linear-gradient(135deg, var(--bg-color) 0%, rgba(30, 30, 60, 0.8) 100%);
      background-size: 400% 400%;
      background-attachment: fixed;
      animation: gradientBG 15s ease infinite;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-top: 100px; /* accounts for header height */
      padding-bottom: 60px; /* accounts for footer height */
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: var(--header-bg);
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 2px 10px var(--shadow-color);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      font-size: 1.8rem;
      animation: bounce 2s ease infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
      40% {transform: translateY(-10px);}
      60% {transform: translateY(-5px);}
    }

    .logo-text {
      background: linear-gradient(to right, var(--accent-color), #00c6ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 4s linear infinite;
      background-size: 200% auto;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    nav a {
      margin-left: 20px;
      color: var(--text-color);
      text-decoration: none;
      font-size: 16px;
      transition: color 0.3s, transform 0.3s;
      position: relative;
    }

    nav a::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 2px;
      bottom: -5px;
      left: 0;
      background-color: var(--accent-color);
      transform: scaleX(0);
      transition: transform 0.3s ease;
    }

    nav a:hover {
      color: var(--accent-color);
      transform: translateY(-2px);
    }

    nav a:hover::after {
      transform: scaleX(1);
    }

    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      background-color: var(--header-bg);
      text-align: center;
      padding: 15px;
      font-size: 14px;
      color: var(--text-color);
      opacity: 0.8;
      box-shadow: 0 -2px 10px var(--shadow-color);
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px var(--shadow-color);
      width: 100%;
      max-width: 450px;
      text-align: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .container:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px var(--shadow-color);
    }

    h2 {
      margin-bottom: 20px;
      font-size: 28px;
      font-weight: 600;
      background: linear-gradient(to right, var(--accent-color), #00c6ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input, button {
      width: 100%;
      padding: 12px 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    input {
      background: var(--input-bg);
      color: var(--text-color);
      border: 1px solid transparent;
    }

    input:focus {
      background: var(--input-focus-bg);
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
    }

    input::placeholder {
      color: var(--text-color);
      opacity: 0.6;
    }

    button {
      background: var(--accent-color);
      color: white;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    button::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 5px;
      height: 5px;
      background: rgba(255, 255, 255, 0.5);
      opacity: 0;
      border-radius: 100%;
      transform: scale(1, 1) translate(-50%);
      transform-origin: 50% 50%;
    }

    button:focus:not(:active)::after {
      animation: ripple 1s ease-out;
    }

    @keyframes ripple {
      0% {
        transform: scale(0, 0);
        opacity: 0.5;
      }
      20% {
        transform: scale(25, 25);
        opacity: 0.3;
      }
      100% {
        opacity: 0;
        transform: scale(40, 40);
      }
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-3px);
      box-shadow: 0 7px 15px rgba(0, 123, 255, 0.3);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 3px 8px rgba(0, 123, 255, 0.2);
    }

    .login-link {
      margin-top: 25px;
      font-size: 14px;
      opacity: 0.9;
    }

    .login-link a {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: bold;
      transition: all 0.3s ease;
      position: relative;
    }

    .login-link a::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 2px;
      bottom: -2px;
      left: 0;
      background-color: var(--accent-color);
      transform: scaleX(0);
      transition: transform 0.3s ease;
    }

    .login-link a:hover {
      color: var(--accent-hover);
    }

    .login-link a:hover::after {
      transform: scaleX(1);
    }

    /* Theme toggle button */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--card-bg);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1000;
      box-shadow: 0 2px 10px var(--shadow-color);
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .theme-toggle:hover {
      background-color: var(--accent-color);
      transform: rotate(180deg);
    }

    .light-icon, .dark-icon {
      font-size: 20px;
      transition: opacity 0.3s ease;
    }

    body.light-theme .dark-icon {
      display: inline;
    }

    body.light-theme .light-icon {
      display: none;
    }

    body:not(.light-theme) .light-icon {
      display: inline;
    }

    body:not(.light-theme) .dark-icon {
      display: none;
    }

    /* Particles background */
    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: -1;
    }
  </style>
</head>
<body>
  <!-- Particles background -->
  <div id="particles-js"></div>

  <!-- Theme toggle button -->
  <button id="theme-toggle" class="theme-toggle">
    <span class="light-icon">☀️</span>
    <span class="dark-icon">🌙</span>
  </button>

  <header>
    <div class="logo">
      <span class="logo-icon">📋</span>
      <span class="logo-text">Task Management</span>
    </div>
    <nav>
      <a href="{% url 'home' %}">Home</a>
    </nav>
  </header>

  <main>
    <div class="container">
      <h2>Register Employee</h2>
      <form id="registerForm" enctype="multipart/form-data">
        <input type="text" id="first_name" placeholder="First Name" required />
        <input type="text" id="last_name" placeholder="Last Name" required />
        <input type="text" id="username" placeholder="Username" required />
        <input type="email" id="email" placeholder="Email" required />
        <input type="text" id="phone_number" placeholder="Phone Number" required />
        <input type="text" id="tech_stacks" placeholder="Tech Stacks (comma separated)" required />
        <input type="password" id="password" placeholder="Password" required />
        <input type="file" id="profile_photo" accept="image/*" />
        <button type="submit">Register</button>
      </form>
      <p class="login-link">
        Already have an account? <a href="{% url 'emp_login' %}">Login</a>
      </p>
    </div>
  </main>

  <footer>
    &copy; 2025 Task Management System. All rights reserved.
  </footer>

  <!-- Particles.js library -->
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

  <script>
    // Initialize particles.js
    document.addEventListener('DOMContentLoaded', function() {
      particlesJS('particles-js', {
        particles: {
          number: { value: 80, density: { enable: true, value_area: 800 } },
          color: { value: "#007BFF" },
          opacity: { value: 0.5 },
          size: { value: 3, random: true },
          line_linked: {
            enable: true,
            distance: 150,
            color: "#007BFF",
            opacity: 0.4,
            width: 1
          },
          move: {
            enable: true,
            speed: 2,
            direction: "none",
            out_mode: "out"
          }
        },
        interactivity: {
          events: {
            onhover: { enable: true, mode: "grab" },
            onclick: { enable: true, mode: "push" }
          },
          modes: {
            grab: { distance: 140, line_linked: { opacity: 1 } },
            push: { particles_nb: 4 }
          }
        },
        retina_detect: true
      });

      // Theme toggle functionality
      const toggleBtn = document.getElementById('theme-toggle');

      // Check for saved theme preference
      const savedTheme = localStorage.getItem("theme");

      if (savedTheme === "light") {
        document.body.classList.add("light-theme");
      }

      // Toggle theme when button is clicked
      toggleBtn.addEventListener("click", function() {
        document.body.classList.toggle("light-theme");

        // Save preference to localStorage
        if (document.body.classList.contains("light-theme")) {
          localStorage.setItem("theme", "light");
        } else {
          localStorage.setItem("theme", "dark");
        }
      });
    });

    // Form submission handler
    document.getElementById("registerForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const form = new FormData();
      form.append("first_name", document.getElementById("first_name").value);
      form.append("last_name", document.getElementById("last_name").value);
      form.append("username", document.getElementById("username").value);
      form.append("email", document.getElementById("email").value);
      form.append("phone_number", document.getElementById("phone_number").value);
      form.append("password", document.getElementById("password").value);

      const techStackInput = document.getElementById("tech_stacks").value.split(",");
      techStackInput.forEach(stack => {
        form.append("tech_stack", stack.trim());
      });

      const photoInput = document.getElementById("profile_photo");
      if (photoInput.files.length > 0) {
        form.append("profile_photo", photoInput.files[0]);
      }

      try {
        const response = await fetch("http://127.0.0.1:8000/api/users/register/employee/", {
          method: "POST",
          body: form
        });

        const data = await response.json();

        if (response.ok) {
          alert("Employee registered successfully!");
          window.location.href = "{% url 'emp_login' %}"; // Redirect to login page
        } else {
          let errorMsg = "";
          for (let key in data) {
            errorMsg += `${key}: ${data[key].join(", ")}\n`;
          }
          alert(errorMsg || "Registration failed");
        }
      } catch (error) {
        console.error("Error:", error);
        alert("Something went wrong. Please try again.");
      }
    });
  </script>
</body>
</html>
