<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Employee Registration</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
  
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #2e2727;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-top: 100px; /* accounts for header height */
      padding-bottom: 60px; /* accounts for footer height */
    }
  
    header {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: #1e1e1e;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
      color: #bb86fc;
      z-index: 1000;
      box-shadow: 0 2px 10px rgba(255, 255, 255, 0.1);
    }
  
    nav a {
      margin-left: 20px;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
    }
  
    nav a:hover {
      color: #bb86fc;
      text-decoration: underline;
    }
  
    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      background-color: #1e1e1e;
      text-align: center;
      padding: 15px;
      font-size: 14px;
      color: #aaa;
      box-shadow: 0 -2px 10px rgba(255, 255, 255, 0.1);
    }
  
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
  
    .container {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(255, 255, 255, 0.2);
      width: 100%;
      max-width: 400px;
      text-align: center;
      transition: transform 0.3s ease-in-out;
    }
  
    .container:hover {
      transform: scale(1.02);
    }
  
    h2 {
      margin-bottom: 20px;
      font-size: 24px;
      color: #bb86fc;
    }
  
    input, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }
  
    input {
      background: #333;
      color: #fff;
    }
  
    input:focus {
      background: #444;
      outline: none;
    }
  
    button {
      background: linear-gradient(135deg, #6200ea, #bb86fc);
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s ease-in-out;
    }
  
    button:hover {
      background: linear-gradient(135deg, #3700b3, #9a67ea);
    }
  
    .login-link {
      margin-top: 15px;
      font-size: 14px;
    }
  
    .login-link a {
      color: #bb86fc;
      text-decoration: none;
      font-weight: bold;
    }
  
    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <div>Task Management System</div>
    <nav>
      <a href="{% url 'home' %}">Home</a>
    </nav>
  </header>

  <main>
    <div class="container">
      <h2>Register Employee</h2>
      <form id="registerForm" enctype="multipart/form-data">
        <input type="text" id="first_name" placeholder="First Name" required />
        <input type="text" id="last_name" placeholder="Last Name" required />
        <input type="text" id="username" placeholder="Username" required />
        <input type="email" id="email" placeholder="Email" required />
        <input type="text" id="phone_number" placeholder="Phone Number" required />
        <input type="text" id="tech_stacks" placeholder="Tech Stacks (comma separated)" required />
        <input type="password" id="password" placeholder="Password" required />
        <input type="file" id="profile_photo" accept="image/*" />
        <button type="submit">Register</button>
      </form>
      <p class="login-link">
        Already have an account? <a href="{% url 'emp_login' %}">Login</a>
      </p>
    </div>
  </main>

  <footer>
    &copy; 2025 Task Management System. All rights reserved.
  </footer>

  <script>
    document.getElementById("registerForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const form = new FormData();
      form.append("first_name", document.getElementById("first_name").value);
      form.append("last_name", document.getElementById("last_name").value);
      form.append("username", document.getElementById("username").value);
      form.append("email", document.getElementById("email").value);
      form.append("phone_number", document.getElementById("phone_number").value);
      form.append("password", document.getElementById("password").value);

      const techStackInput = document.getElementById("tech_stacks").value.split(",");
      techStackInput.forEach(stack => {
        form.append("tech_stack", stack.trim());
      });

      const photoInput = document.getElementById("profile_photo");
      if (photoInput.files.length > 0) {
        form.append("profile_photo", photoInput.files[0]);
      }

      try {
        const response = await fetch("http://127.0.0.1:8000/api/users/register/employee/", {
          method: "POST",
          body: form
        });

        const data = await response.json();

        if (response.ok) {
          alert("Employee registered successfully!");
          window.location.href = "login.html"; // Replace with actual login URL
        } else {
          let errorMsg = "";
          for (let key in data) {
            errorMsg += `${key}: ${data[key].join(", ")}\n`;
          }
          alert(errorMsg || "Registration failed");
        }
      } catch (error) {
        console.error("Error:", error);
        alert("Something went wrong. Please try again.");
      }
    });
  </script>
</body>
</html>
