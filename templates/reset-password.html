<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #2c1d1d;
      --header-bg: #1e1e1e;
      --text-color: white;
      --accent-color: #007BFF;
      --accent-hover: #0056b3;
      --card-bg: rgba(255, 255, 255, 0.1);
      --shadow-color: rgba(0, 0, 0, 0.2);
      --input-bg: #333;
      --input-focus-bg: #444;
      --error-color: #ff4757;
      --success-color: #2ecc71;
    }

    .light-theme {
      --bg-color: #f5f5f5;
      --header-bg: #ffffff;
      --text-color: #333333;
      --card-bg: rgba(0, 0, 0, 0.05);
      --shadow-color: rgba(0, 0, 0, 0.1);
      --input-bg: #e9e9e9;
      --input-focus-bg: #dedede;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: linear-gradient(135deg, var(--bg-color) 0%, rgba(30, 30, 60, 0.8) 100%);
      background-size: 400% 400%;
      background-attachment: fixed;
      animation: gradientBG 15s ease infinite;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px var(--shadow-color);
      width: 100%;
      max-width: 400px;
      text-align: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      animation: fadeIn 0.5s ease-out;
      margin: 20px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .container:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px var(--shadow-color);
    }

    h2 {
      margin-bottom: 20px;
      font-size: 28px;
      font-weight: 600;
      background: linear-gradient(to right, var(--accent-color), #00c6ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input {
      width: 100%;
      padding: 12px 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s ease;
      background: var(--input-bg);
      color: var(--text-color);
      border: 1px solid transparent;
    }

    input:focus {
      background: var(--input-focus-bg);
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.25);
    }

    input::placeholder {
      color: var(--text-color);
      opacity: 0.6;
    }

    button {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px rgba(0, 123, 255, 0.2);
    }

    .button-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .status-message.error {
      background-color: rgba(255, 71, 87, 0.2);
      color: var(--error-color);
      display: block;
    }

    .status-message.success {
      background-color: rgba(46, 204, 113, 0.2);
      color: var(--success-color);
      display: block;
    }

    .back-link {
      margin-top: 20px;
      font-size: 14px;
      color: var(--text-color);
      opacity: 0.8;
    }

    .back-link a {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .back-link a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    /* Particles background */
    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: -1;
    }

    /* Theme toggle button */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--card-bg);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 2px 10px var(--shadow-color);
      transition: all 0.3s ease;
    }

    .theme-toggle:hover {
      transform: rotate(30deg);
    }

    .light-icon, .dark-icon {
      font-size: 20px;
      transition: all 0.3s ease;
    }

    .light-theme .light-icon {
      display: none;
    }

    .light-theme .dark-icon {
      display: block;
    }

    body:not(.light-theme) .light-icon {
      display: block;
    }

    body:not(.light-theme) .dark-icon {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Particles background -->
  <div id="particles-js"></div>

  <!-- Theme toggle button -->
  <button id="theme-toggle" class="theme-toggle">
    <span class="light-icon">☀️</span>
    <span class="dark-icon">🌙</span>
  </button>

  <div class="container">
    <h2>Reset Password</h2>

    <!-- Status message for errors/success -->
    <div id="statusMessage" class="status-message"></div>

    <form id="resetPasswordForm">
      <input type="email" id="email" name="email" value="{{ email }}" readonly>
      <input type="text" id="otp" placeholder="Enter verification code" required>
      <input type="password" id="password" placeholder="New password" required>
      <input type="password" id="confirm_password" placeholder="Confirm new password" required>
      <input type="hidden" id="csrf_token" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
      <button type="submit">
        <div class="button-content">
          <span>Reset Password</span>
          <div class="spinner" id="submitSpinner"></div>
        </div>
      </button>
    </form>

    <!-- Back to Login Link -->
    <div class="back-link">
      Remember your password? <a href="#" id="back-to-login">Back to Login</a>
    </div>
  </div>

  <!-- Particles.js -->
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize particles.js
      particlesJS('particles-js', {
        "particles": {
          "number": {
            "value": 80,
            "density": {
              "enable": true,
              "value_area": 800
            }
          },
          "color": {
            "value": "#ffffff"
          },
          "shape": {
            "type": "circle",
            "stroke": {
              "width": 0,
              "color": "#000000"
            },
          },
          "opacity": {
            "value": 0.5,
            "random": false,
            "anim": {
              "enable": false,
              "speed": 1,
              "opacity_min": 0.1,
              "sync": false
            }
          },
          "size": {
            "value": 3,
            "random": true,
            "anim": {
              "enable": false,
              "speed": 40,
              "size_min": 0.1,
              "sync": false
            }
          },
          "line_linked": {
            "enable": true,
            "distance": 150,
            "color": "#ffffff",
            "opacity": 0.4,
            "width": 1
          },
          "move": {
            "enable": true,
            "speed": 2,
            "direction": "none",
            "random": false,
            "straight": false,
            "out_mode": "out",
            "bounce": false,
            "attract": {
              "enable": false,
              "rotateX": 600,
              "rotateY": 1200
            }
          }
        },
        "interactivity": {
          "detect_on": "canvas",
          "events": {
            "onhover": {
              "enable": true,
              "mode": "grab"
            },
            "onclick": {
              "enable": true,
              "mode": "push"
            },
            "resize": true
          },
          "modes": {
            "grab": {
              "distance": 140,
              "line_linked": {
                "opacity": 1
              }
            },
            "bubble": {
              "distance": 400,
              "size": 40,
              "duration": 2,
              "opacity": 8,
              "speed": 3
            },
            "repulse": {
              "distance": 200,
              "duration": 0.4
            },
            "push": {
              "particles_nb": 4
            },
            "remove": {
              "particles_nb": 2
            }
          }
        },
        "retina_detect": true
      });

      // Theme toggle functionality
      const themeToggle = document.getElementById('theme-toggle');
      const body = document.body;

      // Check for saved theme preference
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        body.classList.add('light-theme');
      }

      themeToggle.addEventListener('click', function() {
        body.classList.toggle('light-theme');

        // Save theme preference
        if (body.classList.contains('light-theme')) {
          localStorage.setItem('theme', 'light');
        } else {
          localStorage.setItem('theme', 'dark');
        }
      });

      // Determine user type from email domain or localStorage
      const email = document.getElementById('email').value;
      const backToLoginLink = document.getElementById('back-to-login');

      // Check if the email belongs to a manager (this is just an example logic)
      // In a real app, you might want to check against your database or use a different approach
      const isManager = localStorage.getItem('role') === 'manager' ||
                       email.includes('manager') ||
                       email.includes('admin');

      // Set the correct login page URL
      backToLoginLink.href = isManager ? '/auth/login/manager/' : '/auth/login/employee/';

      // Form submission handler
      document.getElementById("resetPasswordForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        // Get form values
        const emailInput = document.getElementById("email");
        const otpInput = document.getElementById("otp");
        const passwordInput = document.getElementById("password");
        const confirmPasswordInput = document.getElementById("confirm_password");

        const email = emailInput.value.trim();
        const otp = otpInput.value.trim();
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        // Validate email
        if (!email) {
          showMessage("Please enter your email address.", "error");
          emailInput.focus();
          return;
        }

        // Basic email format validation
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
          showMessage("Please enter a valid email address.", "error");
          emailInput.focus();
          return;
        }

        // Validate OTP
        if (!otp) {
          showMessage("Please enter the verification code.", "error");
          otpInput.focus();
          return;
        }

        // OTP format validation
        if (!/^\d{6}$/.test(otp)) {
          showMessage("Verification code must be a 6-digit number.", "error");
          otpInput.focus();
          return;
        }

        // Validate password
        if (!password) {
          showMessage("Please enter a new password.", "error");
          passwordInput.focus();
          return;
        }

        // Password strength validation
        if (password.length < 8) {
          showMessage("Password must be at least 8 characters long.", "error");
          passwordInput.focus();
          return;
        }

        // Check for at least one digit
        if (!/\d/.test(password)) {
          showMessage("Password must contain at least one digit.", "error");
          passwordInput.focus();
          return;
        }

        // Check for at least one uppercase letter
        if (!/[A-Z]/.test(password)) {
          showMessage("Password must contain at least one uppercase letter.", "error");
          passwordInput.focus();
          return;
        }

        // Check for at least one special character
        if (!/[!@#$%^&*()\-_=+\[\]{}|;:'",.<>/?`~]/.test(password)) {
          showMessage("Password must contain at least one special character.", "error");
          passwordInput.focus();
          return;
        }

        // Validate passwords match
        if (password !== confirmPassword) {
          showMessage("Passwords do not match.", "error");
          confirmPasswordInput.focus();
          return;
        }

        // Show spinner
        const spinner = document.getElementById('submitSpinner');
        spinner.style.display = 'block';

        // Disable the button
        const submitButton = this.querySelector('button[type="submit"]');
        submitButton.disabled = true;

        const formData = {
          email: email,
          otp: otp,
          password: password,
          confirm_password: confirmPassword
        };

        // Get CSRF token from Django template and cookies for redundancy
        let csrfToken = document.getElementById("csrf_token").value;
        if (!csrfToken) {
          csrfToken = getCookie('csrftoken');
        }

        try {
          const response = await fetch("/api/users/reset-password/", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": csrfToken
            },
            body: JSON.stringify(formData),
            credentials: 'same-origin' // Include cookies in the request
          });

          const data = await response.json();

          if (response.ok) {
            showMessage("Password reset successful! You can now login with your new password.", "success");

            // Get the user role from the response
            const userRole = data.role || '';

            // Store the role in localStorage for future use
            if (userRole) {
              localStorage.setItem('role', userRole);
            }

            // Determine the redirect URL based on the role
            const redirectUrl = userRole === 'manager' ?
                              "/auth/login/manager/" :
                              "/auth/login/employee/";

            // Redirect to the appropriate login page after 3 seconds
            setTimeout(() => {
              window.location.href = redirectUrl;
            }, 3000);
          } else {
            // Handle different error scenarios
            if (data.error) {
              showMessage(data.error, "error");
            } else {
              showMessage("Failed to reset password. Please try again.", "error");
            }
          }
        } catch (error) {
          console.error("Error:", error);
          showMessage("An unexpected error occurred. Please try again later.", "error");
        } finally {
          // Hide spinner and re-enable button
          spinner.style.display = 'none';
          submitButton.disabled = false;
        }
      });

      // Helper function to show status messages
      function showMessage(message, type) {
        const statusMessage = document.getElementById('statusMessage');
        statusMessage.textContent = message;
        statusMessage.className = 'status-message ' + type;
        statusMessage.style.display = 'block';
      }

      // Helper function to get cookies (for CSRF token)
      function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
          const cookies = document.cookie.split(';');
          for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
              cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
              break;
            }
          }
        }
        return cookieValue;
      }
    });
  </script>
</body>
</html>
