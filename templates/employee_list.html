<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 20px;
        }
        h1 {
            text-align: center;
            color: #007BFF;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #007BFF;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .error {
            color: red;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Employee List</h1>

    <div class="container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Tech Stack</th>
                </tr>
            </thead>
            <tbody id="employeeTableBody">
                <!-- Employee data will be dynamically inserted here -->
            </tbody>
        </table>
        <p id="errorMessage" class="error"></p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", fetchEmployees);

        async function fetchEmployees() {
            const token = localStorage.getItem("access_token"); // Get JWT Token

            if (!token) {
                document.getElementById("errorMessage").textContent = "Unauthorized: Please log in first.";
                return;
            }

            try {
                const response = await fetch("http://127.0.0.1:8000/api/users/list_employee/", {
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    }
                });

                if (response.status === 401) {
                    document.getElementById("errorMessage").textContent = "Session expired. Please log in again.";
                    return;
                }

                if (!response.ok) {
                    throw new Error("Failed to fetch employees.");
                }

                const employees = await response.json();
                displayEmployees(employees);
            } catch (error) {
                document.getElementById("errorMessage").textContent = error.message;
                console.error(error);
            }
        }

        function displayEmployees(employees) {
            const tableBody = document.getElementById("employeeTableBody");
            tableBody.innerHTML = ""; 

            if (employees.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="7" style="text-align:center;">No employees found.</td></tr>`;
                return;
            }

            employees.forEach(employee => {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${employee.id}</td>
                    <td>${employee.first_name || 'N/A'}</td>
                    <td>${employee.last_name || 'N/A'}</td>
                    <td>${employee.username}</td>
                    <td>${employee.email}</td>
                    <td>${employee.phone_number || 'N/A'}</td>
                    <td>${employee.tech_stack || 'N/A'}</td>
                `;

                tableBody.appendChild(row);
            });
        }
    </script>

</body>
</html>
